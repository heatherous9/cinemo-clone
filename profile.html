<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinemo - profile</title>

    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <header></header>
    <main>
      <section class="profile-intro">
        <h2>YOUR OWN SCENE</h2>
        <p class="profile-intro-p1">누구의 시간인가요?</p>
        <p class="profile-intro-p2">
          함께 보는 이야기, 취향은 각자의 방식으로.
        </p>
      </section>
      <section class="profile-options">
        <ul class="profile-list">
          <li>
            <div class="profile-avatar">
              <img
                src="./styles/Avatar-YOLO.png"
                alt="욜로 프로필"
                class="profile-image"
              />
              <span class="avartar-initial">Y</span>
            </div>

            <span class="profile-name">욜로</span>
            <span class="profile-note">나만의 영화 노트</span>
          </li>
          <li>
            <div class="profile-avatar">
              <img
                src="./styles/Avatar-jiho.png"
                alt="지호 프로필"
                class="profile-image"
              />
              <span class="avartar-initial">J</span>
            </div>

            <span class="profile-name">지호</span>
            <span class="profile-note">새로운 장면을 찾아서</span>
          </li>
          <li>
            <div class="profile-avatar">
              <img
                src="./styles/Avatar-min.png"
                alt="민 프로필"
                class="profile-image"
              />

              <span class="avartar-initial">M</span>
            </div>

            <span class="profile-name">민</span>
            <span class="profile-note">오늘도 한 편</span>
          </li>
          <li>
            <div class="profile-avatar">
              <img
                src="./styles/Avatar-guest.png"
                alt="게스트 프로필"
                class="profile-image"
              />

              <span class="avartar-initial">G</span>
            </div>

            <span class="profile-name">게스트</span>
            <span class="profile-note">가볍게 둘러보기</span>
          </li>
        </ul>
        <button class="bt-profile-setting" type="button">
          <img src="styles/Vector-PENCIL.png" alt="" class="bt-icon" />
          <span>프로필 관리</span>
        </button>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
