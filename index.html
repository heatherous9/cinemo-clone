  <head>

    <title>Cinemo - Home</title>

  <body>
    <main>
      <section class="hero">
        <img
          class="hefo-image"

        <div>

          <span>2026 · SF · 미스터리</span>

        <p class="topic">
          모든 소리가 사라진 해안, 정체를 알 수 없는 신호가 도착한다. 마지막
          관측자는 그 고요 속으로 한 걸음 다가선다.

        <div class="two-button">
          <button type="button" class="one-tton">
            <svg
              width="18"
              height="18"
              viewBox="0 0 18 18"

              <path
                d="M12.7494 12.7494V5.2506H5.25061M12.7494 5.2506L5.25061 12.7494"

                stroke="#241512"

          </button>
          <button type="button" class="tow-tton">
            <svg
              width="18"
              height="18"
              viewBox="0 0 18 18"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M3.74939 9H8.99999M8.99999 9H14.2506M8.99999 9V3.7494M8.99999 9V14.2506"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke="#F3F1ED"
              />

            찜하기

        <div>
          <span>고요가 시작되는 곳, 이야기가 깨어난다.</span>
